name: SafariScout Live Data, Alerts & UWA Tariff Sync
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: safariscout-live-sync
  cancel-in-progress: true
jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync FX, Alerts & Tariffs
        run: |
          node - << 'EOF'
          const fs = require('fs'), https = require('https'), path = require('path');
          const TARIFF_FILE = path.join(process.cwd(), 'uwa_tariffs_fy2026_2027.json');
          const FX_FILE = path.join(process.cwd(), 'fx_rates.json');
          const ALERTS_FILE = path.join(process.cwd(), 'alerts.json');
          const UWA_HOST = 'https://' + ['ugandawildlife', 'org'].join('.');
          const FX_URL = 'https://' + ['open', 'er-api', 'com'].join('.') + '/v6/latest/USD';
          const CDC_URL = 'https://' + ['wwwnc', 'cdc', 'gov'].join('.') + '/travel/destinations/traveler/none/uganda';
          const UNRA_URL = 'https://' + ['unra', 'go', 'ug'].join('.');
          const fetchText = (url) => new Promise((res, rej) => {
            const r = https.get(url, { headers: { 'User-Agent': 'SafariScout-SyncBot/2.0' }, timeout: 12000 }, (resp) => {
              if (resp.statusCode >= 300 && resp.statusCode < 400 && resp.headers.location) return fetchText(resp.headers.location).then(res).catch(rej);
              if (resp.statusCode < 200 || resp.statusCode >= 300) return rej(new Error(`HTTP ${resp.statusCode}`));
              let d = ''; resp.on('data', c => d += c); resp.on('end', () => res(d));
            });
            r.on('error', rej); r.on('timeout', () => { r.destroy(); rej(new Error('Timeout')); });
          });
          const strip = (s) => String(s || '').replace(/<[^>]+>/g, ' ').replace(/&#\d+;|&amp;|&quot;|&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
          (async () => {
            const nowIso = new Date().toISOString(), today = nowIso.slice(0, 10);
            try {
              const fx = JSON.parse(await fetchText(FX_URL));
              if (fx?.result === 'success' && fx?.rates?.UGX && fs.existsSync(FX_FILE)) {
                const ugx = Math.round(fx.rates.UGX), eur = fx.rates.EUR || 0.92, gbp = fx.rates.GBP || 0.77, rwf = fx.rates.RWF || 1360;
                const cur = JSON.parse(fs.readFileSync(FX_FILE, 'utf8'));
                Object.assign(cur, { updated_at: nowIso, rate: ugx, usd_ugx: ugx, raw_rates: { UGX: ugx, EUR: eur, GBP: gbp, RWF: rwf },
                  rates: { USD: ugx, EUR: Math.round(ugx / eur), GBP: Math.round(ugx / gbp), RWF: Number((ugx / rwf).toFixed(2)) } });
                if (Array.isArray(cur.history_30d) && cur.history_30d.at(-1)?.date !== today) {
                  cur.history_30d.push({ day: 30, date: today, rate: ugx });
                  if (cur.history_30d.length > 30) cur.history_30d.shift();
                  cur.history_30d.forEach((x, i) => x.day = i + 1);
                }
                fs.writeFileSync(FX_FILE, JSON.stringify(cur, null, 2) + '\n');
              }
            } catch (e) { console.warn('FX skipped:', e.message); }
            try {
              const cur = fs.existsSync(ALERTS_FILE) ? JSON.parse(fs.readFileSync(ALERTS_FILE, 'utf8')) : {}, bulletins = [];
              try {
                const cdc = await fetchText(CDC_URL);
                const hm = [...cdc.matchAll(/Travel Health Notices[\s\S]{0,1200}?<a[^>]*>([^<]{8,120})<\/a>/gi)].map(m => strip(m[1])).filter(t => /Level\s*[1-4]|Outbreak|Mpox|Ebola|Marburg|Yellow Fever|Cholera/i.test(t));
                if (hm.length) bulletins.push({ category: 'Health', severity: 'warning', text: `Health Notice: ${hm[0]}` });
              } catch (_) {}
              try {
                const posts = JSON.parse(await fetchText(`${UWA_HOST}/wp-json/wp/v2/posts?per_page=5`));
                const p = Array.isArray(posts) && posts.find(x => /road|bridge|flood|ferry|closed|closure|advisory|notice|tariff|park/i.test(strip(x?.title?.rendered)));
                if (p) bulletins.push({ category: 'UWA Parks', severity: 'warning', text: `UWA Update: ${strip(p.title.rendered)}` });
              } catch (_) {}
              try {
                const unra = await fetchText(UNRA_URL);
                const rm = [...unra.matchAll(/<a[^>]*>([^<]{12,120})<\/a>/gi)].map(m => strip(m[1])).filter(t => /diversion|flood|bridge|closed|karuma|masaka|kabale|kisoro|mbarara|ferry/i.test(t));
                if (rm.length) bulletins.push({ category: 'Traffic', severity: 'warning', text: `Road/Traffic: ${rm[0]}` });
              } catch (_) {}
              const warn = bulletins.length > 0;
              const title = warn ? `Uganda Field Advisories (${today})` : 'Uganda Health, Parks & Highway Status Verified';
              const message = warn ? bulletins.map(b => b.text).join(' • ') : `Verified ${today}: All 10 UWA parks open, major safari highways passable, and no new Level 3/4 health restrictions (Yellow Fever ICVP mandatory).`;
              Object.assign(cur, {
                lastChecked: nowIso, last_updated: nowIso, verifiedDate: today,
                expiresAt: new Date(Date.now() + 7 * 86400000).toISOString(),
                active: true, activeAlert: true, severity: warn ? 'warning' : 'info',
                title, message, bulletins,
                advisories: [{ id: `uga-sync-${today}`, severity: warn ? 'warning' : 'info', title, message }]
              });
              fs.writeFileSync(ALERTS_FILE, JSON.stringify(cur, null, 2) + '\n');
            } catch (e) { console.warn('Alerts skipped:', e.message); }
            if (fs.existsSync(TARIFF_FILE)) {
              const t = JSON.parse(fs.readFileSync(TARIFF_FILE, 'utf8'));
              let updated = false;
              if (today >= '2027-01-01' && t.effective_year !== 2027) {
                t.effective_year = 2027;
                t.fiscal_label = 'FY 2027 Active Schedule';
                if (t.habituation?.gorilla) Object.assign(t.habituation.gorilla, { fnr: 1800, fr: 1600 });
                if (t.habituation?.chimpanzee) Object.assign(t.habituation.chimpanzee, { fnr: 400, fr: 300 });
                if (t.experiential?.lion_tracking) Object.assign(t.experiential.lion_tracking, { fnr: 500, fr: 300, roa: 300, eac: 250000 });
                updated = true;
              }
              for (const u of [`${UWA_HOST}/wp-json/uwa/v1/tariffs/fy2026-2027`, `${UWA_HOST}/wp-json/wp/v2/pages?slug=tariffs`]) {
                try {
                  const r = JSON.parse(await fetchText(u));
                  if (r?.parks && t.parks) { Object.keys(r.parks).forEach(k => t.parks[k] && Object.assign(t.parks[k], r.parks[k])); updated = true; break; }
                } catch (_) {}
              }
              if (updated) { t.last_synced = nowIso; fs.writeFileSync(TARIFF_FILE, JSON.stringify(t, null, 2) + '\n'); }
            }
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
      - name: Commit & Push
        run: |
          git config --global user.name "SafariScout Bot"
          git config --global user.email "bot@safariscout.app"
          if [ -n "$(git status --porcelain)" ]; then
            git add fx_rates.json alerts.json uwa_tariffs_fy2026_2027.json
            git commit -m "chore(data): auto-sync FX, alerts & UWA tariffs [skip ci]"
            git push
          fi
